{{ define "main" }}
  <article class="post">
    <h1>{{ .Title }}</h1>
    <p class="date">{{ .Date.Format "2 January 2006" }}</p>
    {{ .Content }}
  </article>

  <section>
    <div class="rows">
      <a class="row" href="{{ .Site.BaseURL }}">
        <span class="name">All posts</span>
        <span class="tail">Back <span class="arrow">&#8599;</span></span>
      </a>
    </div>
  </section>
{{ end }}
