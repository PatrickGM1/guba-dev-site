<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &rarr; {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="mark" href="https://guba.dev">guba.dev</a>
      <nav class="nav">
        <a href="https://guba.dev/projects">Projects</a>
        <a href="{{ .Site.BaseURL }}" aria-current="page">Blog</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <div class="wrap">
      <span>&copy; {{ now.Year }} <a href="https://guba.dev">guba.dev</a></span>
      <span>Groningen</span>
    </div>
  </footer>
</body>
</html>
